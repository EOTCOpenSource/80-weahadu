<!DOCTYPE html>
<html lang="am">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>መጽሐፍ ቅዱስ — ሰማንያ አሐዱ</title>
    <link rel="icon" href="bible-icon.svg">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=Noto+Sans+Ethiopic:wght@400;500;700;800&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --primary-burgundy: #6B1F2A;
            --accent-gold: #F4D38A;

            --parchment-bg: #EFE9DF;
            --surface-white: #ffffff;

            --text-primary: #241914;
            --text-secondary: #6b5a52;

            --nav-bg-light: rgba(239, 233, 223, 0.95);
            --border-color-light: rgba(107, 90, 82, 0.12);
            --hover-bg-light: rgba(0, 0, 0, 0.03);

            --bg-primary-dark: #121212;
            --text-primary-dark: #e1e1e1;
            --border-color-dark: rgba(255, 255, 255, 0.06);
            --hover-bg-dark: rgba(255, 255, 255, 0.03);

            --parchment-dark-bg: #1f1917;
            --parchment-dark-text: #EFE6D8;
            --parchment-dark-nav: rgba(31, 25, 23, 0.95);

            --font-ethi: 'Noto Sans Ethiopic', 'Inter', system-ui, serif;
            --font-latn: 'Inter', system-ui, -apple-system, "Segoe UI", Roboto, serif;
        }

        html, body { height: 100%; margin: 0; overflow: hidden; }

        body {
            font-family: var(--font-ethi);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transition: background-color .4s cubic-bezier(.4, 0, .2, 1), color .4s cubic-bezier(.4, 0, .2, 1);
            background-color: var(--surface-white);
            color: var(--text-primary);
        }

        * { scrollbar-width: none; -ms-overflow-style: none; }
        *::-webkit-scrollbar { display: none; }

        /* ---------- header ---------- */
        #app-header {
            position: fixed; top: 0; left: 0; right: 0; height: 64px;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px; gap: 12px;
            background-color: var(--nav-bg-light);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color-light);
            z-index: 1000; transition: all .3s ease;
        }

        #app-title { display: flex; align-items: center; gap: 12px; min-width: 0; }
        #app-title h1 {
            font-size: 19px; margin: 0; font-weight: 800; letter-spacing: -.4px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        #app-title .sub {
            display: block; font-size: 11px; font-weight: 500; letter-spacing: .3px;
            color: var(--text-secondary); font-family: var(--font-latn);
        }
        body.dark-mode #app-title .sub { color: #9b8a7e; }

        #app-controls { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

        .control-btn {
            background: transparent; border: 1px solid transparent; cursor: pointer;
            padding: 9px; border-radius: 12px; display: flex; align-items: center;
            justify-content: center; color: var(--text-primary);
            transition: all .2s ease; font-family: var(--font-latn);
            font-size: 13px; font-weight: 700; line-height: 1;
        }
        .control-btn:hover { background-color: var(--hover-bg-light); border-color: var(--border-color-light); }
        .control-btn.on { background: var(--primary-burgundy); color: var(--accent-gold); }

        #font-size-controls {
            display: flex; align-items: center; background: var(--hover-bg-light);
            border-radius: 14px; padding: 3px; gap: 2px;
        }
        #font-size-controls .control-btn { padding: 7px 11px; border-radius: 10px; }

        /* ---------- layout ---------- */
        #app-container { height: 100vh; display: flex; padding-top: 64px; box-sizing: border-box; }

        #nav-panel {
            width: 380px; min-width: 320px; background: var(--parchment-bg);
            display: flex; flex-direction: column;
            border-right: 1px solid var(--border-color-light);
            z-index: 60; transition: all .3s cubic-bezier(.4, 0, .2, 1);
        }

        /* ---------- edition picker & custom dropdowns ---------- */
        #edition-bar {
            padding: 14px 16px; border-bottom: 1px solid var(--border-color-light);
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
            position: relative; box-sizing: border-box;
        }
        .custom-dropdown {
            position: relative;
            display: flex; flex-direction: column;
            min-width: 0;
        }
        .custom-dropdown label {
            display: block; font-family: var(--font-latn); font-size: 10.5px;
            font-weight: 700; letter-spacing: .8px; text-transform: uppercase;
            color: var(--text-secondary); margin-bottom: 6px;
        }
        .dropdown-trigger {
            width: 100%; box-sizing: border-box; padding: 10px 12px;
            border-radius: 11px; border: 1px solid rgba(107, 90, 82, 0.2);
            background-color: var(--surface-white); color: var(--text-primary);
            font-family: var(--font-ethi); font-size: 13px; font-weight: 600;
            cursor: pointer; display: flex; align-items: center; justify-content: space-between;
            gap: 6px; text-align: left;
            transition: all .2s cubic-bezier(.4, 0, .2, 1);
            box-shadow: 0 1px 3px rgba(36, 25, 20, 0.04);
        }
        .dropdown-trigger:hover {
            border-color: rgba(107, 31, 42, 0.45);
            background-color: #FAF6F0;
            box-shadow: 0 2px 6px rgba(107, 31, 42, 0.08);
        }
        .dropdown-trigger:focus-visible {
            outline: 2px solid var(--primary-burgundy);
            outline-offset: 1px;
        }
        .trigger-text {
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            flex: 1; min-width: 0; font-size: 13px;
        }
        .trigger-chevron {
            flex-shrink: 0;
            color: var(--primary-burgundy);
            transition: transform .22s ease, color .2s ease;
        }
        .custom-dropdown.open .trigger-chevron {
            transform: rotate(180deg);
        }
        .dropdown-menu {
            position: absolute; top: calc(100% + 6px);
            max-height: 270px; overflow-y: auto; z-index: 500;
            margin: 0; padding: 6px; list-style: none;
            background: #ffffff;
            border-radius: 13px;
            border: 1px solid rgba(107, 90, 82, 0.18);
            box-shadow: 0 12px 30px rgba(36, 25, 20, 0.16), 0 3px 10px rgba(0, 0, 0, 0.05);
            opacity: 0; transform: translateY(-5px) scale(0.98);
            pointer-events: none;
            transition: opacity .16s ease, transform .16s ease;
            box-sizing: border-box;
        }
        #lang-dropdown .dropdown-menu {
            left: 0; width: 100%; min-width: 145px;
        }
        #edition-dropdown .dropdown-menu {
            right: 0; left: auto; width: 235px;
        }
        .custom-dropdown.open .dropdown-menu {
            opacity: 1; transform: translateY(0) scale(1);
            pointer-events: auto;
        }
        .dropdown-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 8px 11px; margin-bottom: 2px;
            border-radius: 8px; cursor: pointer;
            font-size: 13px; font-weight: 500;
            color: var(--text-primary);
            transition: all .14s ease;
        }
        .dropdown-item:last-child { margin-bottom: 0; }
        .dropdown-item:hover {
            background-color: rgba(107, 31, 42, 0.07);
            color: var(--primary-burgundy);
        }
        .dropdown-item.selected {
            background: var(--primary-burgundy) !important;
            color: var(--accent-gold) !important;
            font-weight: 700;
        }
        .dropdown-item .item-sub {
            font-size: 10px; font-family: var(--font-latn); font-weight: 600;
            opacity: .85; margin-top: 1px;
        }
        .dropdown-item .check-icon {
            display: none; margin-left: 6px; flex-shrink: 0;
        }
        .dropdown-item.selected .check-icon {
            display: inline-block;
        }
        .sr-only {
            position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
            overflow: hidden; clip: rect(0, 0, 0, 0); border: 0;
        }

        #edition-meta {
            grid-column: 1 / -1; font-family: var(--font-latn); font-size: 11.5px;
            font-weight: 500; color: var(--text-secondary); line-height: 1.5;
            margin-top: 2px;
        }

        /* Dark Mode Custom Dropdowns */
        body.dark-mode .dropdown-trigger {
            background-color: #261E1B; color: var(--parchment-dark-text);
            border-color: rgba(255, 255, 255, 0.08);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
        }
        body.dark-mode .dropdown-trigger:hover {
            border-color: rgba(244, 211, 138, 0.4);
            background-color: #2F2522;
        }
        body.dark-mode .dropdown-trigger:focus-visible {
            outline: 2px solid var(--accent-gold);
        }
        body.dark-mode .trigger-chevron { color: var(--accent-gold); }
        body.dark-mode .dropdown-menu {
            background: #201715;
            border-color: rgba(255, 255, 255, 0.09);
            box-shadow: 0 14px 36px rgba(0, 0, 0, 0.65);
        }
        body.dark-mode .dropdown-item {
            color: var(--parchment-dark-text);
        }
        body.dark-mode .dropdown-item:hover {
            background-color: rgba(244, 211, 138, 0.08);
            color: var(--accent-gold);
        }
        body.dark-mode .custom-dropdown label { color: #9b8a7e; }
        body.dark-mode #edition-meta { color: #a89684; }

        /* ---------- testament tabs ---------- */
        #testament-tabs {
            display: flex; align-items: center; gap: 4px; padding: 8px;
            border-bottom: 1px solid var(--border-color-light);
        }
        .tt-tab {
            flex: 1; padding: 10px 6px; text-align: center; background: transparent;
            border: none; font-weight: 700; border-radius: 9px; cursor: pointer;
            font-family: var(--font-ethi); font-size: 14px;
            color: var(--text-secondary); transition: all .2s;
        }
        .tt-tab:hover { background: var(--hover-bg-light); }
        .tt-tab.active { background: var(--primary-burgundy); color: var(--accent-gold); }
        body.dark-mode .tt-tab { color: #9b8a7e; }
        body.dark-mode .tt-tab:hover { background: var(--hover-bg-dark); }

        /* ---------- lists ---------- */
        #lists { display: flex; flex: 1; overflow: hidden; }
        #books-sidebar {
            width: 58%; border-right: 1px solid var(--border-color-light);
            display: flex; flex-direction: column;
        }
        #chapters-sidebar { width: 42%; display: flex; flex-direction: column; }
        .list-head {
            margin: 0; padding: 12px 16px; font-weight: 700; font-size: 13px;
            font-family: var(--font-latn); letter-spacing: .4px;
            color: var(--text-secondary); text-transform: uppercase;
        }
        body.dark-mode .list-head { color: #9b8a7e; }

        #books-list, #chapters-list {
            list-style: none; margin: 0; padding: 4px 0 20px;
            flex-grow: 1; overflow-y: auto;
        }
        #books-list li, #chapters-list li {
            padding: 10px 16px; margin: 2px 10px; border-radius: 9px; cursor: pointer;
            font-size: 15px; font-weight: 500; transition: all .18s ease;
            color: var(--text-primary);
        }
        #chapters-list li { text-align: center; font-family: var(--font-latn); font-weight: 600; }
        #books-list li:hover, #chapters-list li:hover { background-color: var(--hover-bg-light); }
        #books-list li:hover { padding-left: 20px; }
        .active-item {
            background: var(--primary-burgundy) !important; color: var(--accent-gold) !important;
            box-shadow: 0 6px 18px rgba(107, 31, 42, .18); font-weight: 700;
        }
        .empty-note {
            padding: 20px 16px; font-size: 13px; color: var(--text-secondary);
            font-family: var(--font-latn); line-height: 1.6;
        }

        /* ---------- reading pane ---------- */
        main {
            flex: 1; overflow-y: auto; padding: 48px 80px;
            background-color: var(--parchment-bg); scroll-behavior: smooth;
        }
        #main-content-area { max-width: 760px; margin: 0 auto; }

        #chapter-title {
            font-size: 40px; font-weight: 800; margin: 0 0 8px;
            color: var(--primary-burgundy); letter-spacing: -1px;
        }
        #chapter-sub {
            font-family: var(--font-latn); font-size: 13px; font-weight: 500;
            color: var(--text-secondary); margin-bottom: 36px; letter-spacing: .3px;
        }
        body.dark-mode #chapter-title { color: var(--accent-gold); }
        body.dark-mode #chapter-sub { color: #9b8a7e; }

        #text-container { font-size: 21px; line-height: 1.95; transition: font-size .25s ease; }
        body.dark-mode #text-container { color: var(--parchment-dark-text); }

        .heading {
            font-weight: 700; margin: 40px 0 18px; line-height: 1.4;
            color: var(--primary-burgundy);
        }
        .heading.major {
            font-size: .95em; text-transform: none; letter-spacing: .2px;
            padding-bottom: 10px; border-bottom: 2px solid var(--border-color-light);
        }
        .heading.section { font-size: 1.05em; }
        .heading.descriptive { font-size: .82em; font-style: italic; font-weight: 500; color: var(--text-secondary); }
        .heading.reference { font-size: .74em; font-weight: 500; color: var(--text-secondary); margin: 6px 0 18px; }
        .heading:first-child { margin-top: 0; }
        body.dark-mode .heading { color: var(--accent-gold); }
        body.dark-mode .heading.descriptive,
        body.dark-mode .heading.reference { color: #a89684; }
        body.dark-mode .heading.major { border-bottom-color: var(--border-color-dark); }

        .verse {
            margin: 0 0 14px; text-align: justify;
            padding: 3px 6px; border-radius: 6px;
            transition: background-color .18s ease;
        }
        .verse:hover { background-color: rgba(107, 31, 42, .04); }
        .verse.highlighted {
            background-color: rgba(107, 31, 42, .12);
            box-shadow: inset 3px 0 0 var(--primary-burgundy);
        }
        body.dark-mode .verse:hover { background-color: rgba(244, 211, 138, .04); }
        body.dark-mode .verse.highlighted {
            background-color: rgba(244, 211, 138, .12);
            box-shadow: inset 3px 0 0 var(--accent-gold);
        }

        .vnum {
            font-family: var(--font-latn); font-size: .58em; font-weight: 800;
            color: var(--primary-burgundy); vertical-align: super;
            margin-right: 7px; user-select: none; cursor: pointer;
            display: inline-block; transition: transform .12s ease, opacity .12s ease;
        }
        .vnum:hover { transform: scale(1.15); opacity: .85; }
        .vnum.geez { font-family: var(--font-ethi); font-size: .62em; }
        body.dark-mode .vnum { color: var(--accent-gold); }

        .vline { display: block; }
        .vline.q1 { padding-left: 1.6em; }
        .vline.q2 { padding-left: 3em; }
        .vline.q3, .vline.q4 { padding-left: 4.4em; }
        .vline.qd, .vline.qc { padding-left: 1.6em; font-style: italic; }
        .vline.pc { text-align: center; padding: 0; }

        .aux {
            display: block; font-family: var(--font-latn); font-size: .62em;
            line-height: 1.7; color: var(--text-secondary);
            margin: 6px 0 0 1.2em; padding-left: 12px;
            border-left: 2px solid var(--border-color-light);
        }
        .aux b { color: var(--primary-burgundy); font-weight: 700; }
        body.dark-mode .aux { color: #a89684; border-left-color: var(--border-color-dark); }
        body.dark-mode .aux b { color: var(--accent-gold); }

        /* ---------- chapter pager ---------- */
        #pager {
            display: flex; justify-content: space-between; gap: 12px;
            margin: 56px 0 20px; padding-top: 24px;
            border-top: 1px solid var(--border-color-light);
        }
        .pager-btn {
            flex: 1; padding: 14px 18px; border-radius: 12px; cursor: pointer;
            background: transparent; border: 1px solid var(--border-color-light);
            color: var(--text-primary); font-family: var(--font-ethi);
            font-size: 14px; font-weight: 600; transition: all .2s;
        }
        .pager-btn:hover:not(:disabled) { background: var(--primary-burgundy); color: var(--accent-gold); border-color: transparent; }
        .pager-btn:disabled { opacity: .32; cursor: default; }
        body.dark-mode .pager-btn { color: var(--parchment-dark-text); border-color: var(--border-color-dark); }
        body.dark-mode #pager { border-top-color: var(--border-color-dark); }

        .msg { font-size: 16px; color: var(--text-secondary); line-height: 1.8; }

        /* ---------- toast notification ---------- */
        #toast {
            position: fixed; bottom: 28px; left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--primary-burgundy); color: var(--accent-gold);
            padding: 10px 22px; border-radius: 24px;
            font-family: var(--font-ethi); font-size: 13px; font-weight: 700;
            box-shadow: 0 8px 24px rgba(0, 0, 0, .28);
            z-index: 3000; opacity: 0; pointer-events: none;
            transition: transform .25s cubic-bezier(.4, 0, .2, 1), opacity .25s ease;
        }
        #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        body.dark-mode #toast {
            background: #2a201c; color: var(--accent-gold);
            border: 1px solid var(--border-color-dark);
        }

        /* ---------- dark ---------- */
        body { color-scheme: light; }
        body.dark-mode {
            color-scheme: dark;
            background-color: var(--bg-primary-dark);
            color: var(--text-primary-dark);
        }
        body.dark-mode #app-header { background-color: var(--parchment-dark-nav); border-bottom-color: rgba(255, 255, 255, .04); }
        body.dark-mode #nav-panel { background-color: var(--parchment-dark-nav); border-right-color: var(--border-color-dark); }
        body.dark-mode main { background-color: var(--parchment-dark-bg); }
        body.dark-mode .control-btn { color: var(--parchment-dark-text); }
        body.dark-mode .control-btn:hover { background-color: var(--hover-bg-dark); border-color: var(--border-color-dark); }
        body.dark-mode .control-btn.on { background: var(--primary-burgundy); color: var(--accent-gold); }
        body.dark-mode #font-size-controls { background: var(--hover-bg-dark); }
        body.dark-mode #books-list li, body.dark-mode #chapters-list li { color: var(--parchment-dark-text); }
        body.dark-mode #books-list li:hover, body.dark-mode #chapters-list li:hover { background-color: rgba(255, 255, 255, .02); }
        body.dark-mode #edition-bar, body.dark-mode #testament-tabs, body.dark-mode .list-head { border-color: var(--border-color-dark); }
        body.dark-mode #books-sidebar { border-right-color: var(--border-color-dark); }

        /* ---------- responsive & backdrop ---------- */
        #nav-backdrop {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, .45); z-index: 1900;
            opacity: 0; transition: opacity .25s ease; pointer-events: none;
            backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
        }
        #nav-backdrop.open { display: block; opacity: 1; pointer-events: auto; }

        #mobile-menu-btn { display: none; }
        @media (max-width: 900px) {
            #mobile-menu-btn { display: flex; }
            #nav-panel {
                position: fixed; top: 64px; left: 0; bottom: 0;
                width: 88%; max-width: 360px; transform: translateX(-100%);
                z-index: 2000; border-top: 1px solid var(--border-color-light);
            }
            #nav-panel.open { transform: translateX(0); box-shadow: 20px 0 50px rgba(0, 0, 0, .2); }
            body.dark-mode #nav-panel.open { box-shadow: 20px 0 50px rgba(0, 0, 0, .5); }
            main { padding: 32px 20px; }
            #chapter-title { font-size: 30px; }
            #text-container { font-size: 18px; }
            #app-title h1 { font-size: 16px; }
            #font-size-controls { display: none; }
        }
        @media (max-width: 420px) {
            #app-header { padding: 0 12px; }
            #numerals-toggle { display: none; }
        }
    </style>
</head>

<body>
    <header id="app-header">
        <div style="display:flex; align-items:center; gap:8px; min-width:0;">
            <button id="mobile-menu-btn" aria-label="ዝርዝር" title="ዝርዝር" class="control-btn">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round">
                    <line x1="3" y1="12" x2="21" y2="12" />
                    <line x1="3" y1="6" x2="21" y2="6" />
                    <line x1="3" y1="18" x2="21" y2="18" />
                </svg>
            </button>
            <div id="app-title">
                <span style="font-size:24px; color:var(--primary-burgundy); flex-shrink:0;">✠</span>
                <div style="min-width:0;">
                    <h1 id="title-main">መጽሐፍ ቅዱስ</h1>
                    <span class="sub" id="title-sub"></span>
                </div>
            </div>
        </div>
        <div id="app-controls">
            <button class="control-btn" id="numerals-toggle" title="የቁጥር ዓይነት (፩ / 1)">፩</button>
            <button class="control-btn" id="notes-toggle" title="ማስታወሻና ማጣቀሻ አሳይ">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
                    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
                </svg>
            </button>
            <div id="font-size-controls">
                <button class="control-btn" id="decrease-font" title="ፊደል አሳንስ">A-</button>
                <button class="control-btn" id="increase-font" title="ፊደል አሳድግ">A+</button>
            </div>
            <button class="control-btn" id="theme-toggle" title="ገጽታ ቀይር">
                <svg id="theme-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2"></svg>
            </button>
        </div>
    </header>

    <div id="nav-backdrop"></div>
    <div id="toast"></div>

    <div id="app-container">
        <nav id="nav-panel" aria-label="ትርጉም፣ መጻሕፍት እና ምዕራፎች">
            <div id="edition-bar">
                <div class="custom-dropdown" id="lang-dropdown">
                    <label id="lbl-lang" for="lang-select">ቋንቋ</label>
                    <button type="button" class="dropdown-trigger" id="lang-trigger" aria-haspopup="listbox" aria-expanded="false">
                        <span class="trigger-text" id="lang-trigger-text">ቋንቋ ምረጥ</span>
                        <svg class="trigger-chevron" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <path d="M6 9l6 6 6-6"/>
                        </svg>
                    </button>
                    <ul class="dropdown-menu" id="lang-menu" role="listbox"></ul>
                    <select id="lang-select" class="sr-only" tabindex="-1"></select>
                </div>

                <div class="custom-dropdown" id="edition-dropdown">
                    <label id="lbl-edition" for="edition-select">ዕትም</label>
                    <button type="button" class="dropdown-trigger" id="edition-trigger" aria-haspopup="listbox" aria-expanded="false">
                        <span class="trigger-text" id="edition-trigger-text">ዕትም ምረጥ</span>
                        <svg class="trigger-chevron" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <path d="M6 9l6 6 6-6"/>
                        </svg>
                    </button>
                    <ul class="dropdown-menu" id="edition-menu" role="listbox"></ul>
                    <select id="edition-select" class="sr-only" tabindex="-1"></select>
                </div>

                <div id="edition-meta"></div>
            </div>

            <div id="testament-tabs">
                <button class="tt-tab" data-t="old" id="tab-old">ብሉይ ኪዳን</button>
                <button class="tt-tab" data-t="new" id="tab-new">አዲስ ኪዳን</button>
            </div>

            <div id="lists">
                <aside id="books-sidebar">
                    <h2 class="list-head" id="head-books">መጻሕፍት</h2>
                    <ul id="books-list"></ul>
                </aside>
                <aside id="chapters-sidebar">
                    <h2 class="list-head" id="head-chapters">ምዕራፍ</h2>
                    <ul id="chapters-list"></ul>
                </aside>
            </div>
        </nav>

        <main>
            <div id="main-content-area">
                <h2 id="chapter-title"></h2>
                <div id="chapter-sub"></div>
                <div id="text-container">
                    <p class="msg" id="initial-message">በመጫን ላይ…</p>
                </div>
                <div id="pager" style="display:none;">
                    <button class="pager-btn" id="prev-ch">← ያለፈው ምዕራፍ</button>
                    <button class="pager-btn" id="next-ch">ቀጣይ ምዕራፍ →</button>
                </div>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const DATA = 'data';

            const $ = id => document.getElementById(id);
            const body = document.body;
            const navPanel = $('nav-panel');
            const backdrop = $('nav-backdrop');
            const textEl = $('text-container');
            const booksEl = $('books-list');
            const chaptersEl = $('chapters-list');
            const titleEl = $('chapter-title');
            const subEl = $('chapter-sub');
            const pagerEl = $('pager');
            const langSel = $('lang-select');
            const edSel = $('edition-select');
            const edMetaEl = $('edition-meta');
            const themeIcon = $('theme-icon');

            const sunIcon = `<path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/><circle cx="12" cy="12" r="5"/>`;
            const moonIcon = `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>`;

            // ---------- state ----------
            let EDITIONS = [];          // editions.json
            let CANON = [];             // canon.json
            let canonById = {};
            let meta = null;            // current edition meta.json
            let booksById = {};
            let book = null;            // loaded book document
            let bookId = null, chapterNo = null, testament = 'old';
            let fontSize = 21;
            let geezNumerals = true;
            let showAux = false;
            const cache = new Map();    // "edition/BOOKID" -> document

            /* UI strings follow the language of the edition being read, so the
             * KJV does not come wrapped in Amharic chrome. Ge'ez falls back to
             * Amharic — it is a liturgical language with no modern UI register.
             * The Tigrinya and Oromo strings are standard scripture vocabulary
             * and worth a native speaker's review. */
            const L10N = {
                am: {
                    lang: 'ቋንቋ', edition: 'ዕትም', books: 'መጻሕፍት', chapters: 'ምዕራፍ',
                    chapter: 'ምዕራፍ', verses: 'ቁጥር', ot: 'ብሉይ ኪዳን', nt: 'አዲስ ኪዳን',
                    prev: '← ያለፈው ምዕራፍ', next: 'ቀጣይ ምዕራፍ →', loading: 'በመጫን ላይ…',
                    none: 'በዚህ ዕትም ውስጥ የለም።', note: 'ማስታወሻ', ref: 'ማጣቀሻ',
                    copied: 'ቅጂ ተወስዷል'
                },
                ti: {
                    lang: 'ቋንቋ', edition: 'ሕታም', books: 'መጻሕፍቲ', chapters: 'ምዕራፍ',
                    chapter: 'ምዕራፍ', verses: 'ቁጽሪ', ot: 'ብሉይ ኪዳን', nt: 'ሓድሽ ኪዳን',
                    prev: '← ዝሓለፈ ምዕራፍ', next: 'ቀጻሊ ምዕራፍ →', loading: 'ይጽዓን ኣሎ…',
                    none: 'ኣብዚ ሕታም የለን።', note: 'መዘኻኸሪ', ref: 'መወከሲ',
                    copied: 'ተቐዲሑ ኣሎ'
                },
                en: {
                    lang: 'Language', edition: 'Edition', books: 'Books', chapters: 'Chapter',
                    chapter: 'Chapter', verses: 'verses', ot: 'Old Testament', nt: 'New Testament',
                    prev: '← Previous', next: 'Next →', loading: 'Loading…',
                    none: 'Not in this edition.', note: 'Note', ref: 'Reference',
                    copied: 'Verse copied'
                },
                om: {
                    lang: 'Afaan', edition: 'Maxxansa', books: 'Kitaabota', chapters: 'Boqonnaa',
                    chapter: 'Boqonnaa', verses: 'lakkoofsa', ot: 'Kakuu Moofaa', nt: 'Kakuu Haaraa',
                    prev: '← Duraa', next: 'Itti aanu →', loading: 'Fe’amaa jira…',
                    none: 'Maxxansa kana keessa hin jiru.', note: 'Yaadannoo', ref: 'Wabii',
                    copied: 'Waraabameera'
                }
            };
            L10N.gez = L10N.am;
            const t = () => L10N[(meta && meta.language) || 'am'] || L10N.am;

            function showToast(text) {
                const toast = $('toast');
                if (!toast) return;
                toast.textContent = text;
                toast.classList.add('show');
                clearTimeout(toast._timer);
                toast._timer = setTimeout(() => toast.classList.remove('show'), 2400);
            }

            function parseHash() {
                const raw = window.location.hash.replace(/^#\/?/, '').trim();
                if (!raw) return null;
                const parts = raw.split('/');
                if (parts.length >= 3) {
                    return {
                        edition: parts[0],
                        bookId: parts[1],
                        chapter: parseInt(parts[2], 10) || 1,
                        verse: parts[3] ? (parseInt(parts[3], 10) || parts[3]) : null
                    };
                } else if (parts.length === 2) {
                    return {
                        edition: null,
                        bookId: parts[0],
                        chapter: parseInt(parts[1], 10) || 1,
                        verse: null
                    };
                }
                return null;
            }

            function updateUrlHash(v) {
                if (!meta || !bookId || !chapterNo) return;
                const hash = v != null ? `#${meta.id}/${bookId}/${chapterNo}/${v}` : `#${meta.id}/${bookId}/${chapterNo}`;
                if (window.location.hash !== hash) {
                    history.replaceState(null, '', hash);
                }
            }

            function highlightVerse(vNum) {
                document.querySelectorAll('.verse').forEach(el => {
                    el.classList.toggle('highlighted', el.dataset.v === String(vNum));
                });
            }

            function copyVerse(v) {
                const entry = booksById[bookId];
                const bookName = entry ? entry.name : bookId;
                const refStr = `${bookName} ${num(chapterNo)}፥${(geezNumerals && v.alt) ? v.alt : v.n}`;
                const fullText = `${refStr} — "${v.t || ''}" (${meta.abbrev || meta.title})`;

                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(fullText).catch(() => {});
                }
                highlightVerse(v.n);
                updateUrlHash(v.n);
                showToast(`${t().copied || 'ቅጂ ተወስዷል'}: ${refStr}`);
            }

            const closeDrawer = () => {
                navPanel.classList.remove('open');
                if (backdrop) backdrop.classList.remove('open');
            };
            const toggleDrawer = () => {
                navPanel.classList.toggle('open');
                if (backdrop) backdrop.classList.toggle('open', navPanel.classList.contains('open'));
            };

            function applyLabels() {
                const L = t();
                $('lbl-lang').textContent = L.lang;
                $('lbl-edition').textContent = L.edition;
                $('head-books').textContent = L.books;
                $('head-chapters').textContent = L.chapters;
                $('tab-old').textContent = L.ot;
                $('tab-new').textContent = L.nt;
                $('prev-ch').textContent = L.prev;
                $('next-ch').textContent = L.next;
            }

            const ETH_DIGITS = ['', '፩', '፪', '፫', '፬', '፭', '፮', '፯', '፰', '፱'];
            const ETH_TENS = ['', '፲', '፳', '፴', '፵', '፶', '፷', '፸', '፹', '፺'];

            /** Ge'ez numeral for 1..999 — used for chapter numbers, which the
             *  data does not carry an `alt` for on every edition. */
            function toGeez(n) {
                n = Number(n);
                if (!Number.isInteger(n) || n < 1 || n > 999) return String(n);
                let out = '';
                const hundreds = Math.floor(n / 100), rest = n % 100;
                if (hundreds) out += (hundreds > 1 ? ETH_DIGITS[hundreds] : '') + '፻';
                out += ETH_TENS[Math.floor(rest / 10)] + ETH_DIGITS[rest % 10];
                return out || String(n);
            }

            const isEthiopic = () => !meta || meta.script !== 'Latn';
            const num = n => (geezNumerals && isEthiopic()) ? toGeez(n) : String(n);

            // ---------- settings ----------
            function applyTheme(t) {
                body.classList.toggle('dark-mode', t === 'dark');
                themeIcon.innerHTML = t === 'dark' ? sunIcon : moonIcon;
                localStorage.setItem('theme', t);
            }
            function applyFont(size) {
                fontSize = Math.max(14, Math.min(34, size));
                textEl.style.fontSize = fontSize + 'px';
                localStorage.setItem('fontSize', fontSize);
            }
            function saveState() {
                localStorage.setItem('bibleState', JSON.stringify({
                    edition: meta && meta.id, bookId, chapter: chapterNo, testament
                }));
            }

            $('theme-toggle').onclick = () =>
                applyTheme(body.classList.contains('dark-mode') ? 'light' : 'dark');
            $('increase-font').onclick = () => applyFont(fontSize + 2);
            $('decrease-font').onclick = () => applyFont(fontSize - 2);
            $('mobile-menu-btn').onclick = e => { e.stopPropagation(); toggleDrawer(); };
            if (backdrop) backdrop.onclick = closeDrawer;

            $('numerals-toggle').onclick = e => {
                geezNumerals = !geezNumerals;
                localStorage.setItem('geezNumerals', geezNumerals ? '1' : '0');
                e.currentTarget.textContent = geezNumerals ? '፩' : '1';
                e.currentTarget.classList.toggle('on', geezNumerals);
                if (book) { renderChapters(); renderChapter(); }
            };
            $('notes-toggle').onclick = e => {
                showAux = !showAux;
                localStorage.setItem('showAux', showAux ? '1' : '0');
                e.currentTarget.classList.toggle('on', showAux);
                if (book) renderChapter();
            };

            // ---------- data ----------
            const getJSON = async (url, init) => {
                const r = await fetch(url, init);
                if (!r.ok) throw new Error(`${url} (${r.status})`);
                return r.json();
            };

            /* Book files are cached for a year, so the URL has to change when
             * the data does. data/revisions.json carries a revision per
             * edition, bumped by tools/release.py; appending it busts the cache
             * on exactly the editions that changed and nothing else. */
            let REVISIONS = {};
            const ver = (url, editionId) => {
                const rev = REVISIONS[editionId] && REVISIONS[editionId].revision;
                return rev ? `${url}?v=${rev}` : url;
            };

            /** old + deuterocanonical read as one testament in the EOTC canon */
            const groupOf = id => {
                const c = canonById[id];
                return (c && c.testament === 'new') ? 'new' : 'old';
            };

            // ---------- custom dropdown controller ----------
            function toggleDropdown(id) {
                const el = $(id);
                if (!el) return;
                const isOpen = el.classList.contains('open');
                closeDropdowns();
                if (!isOpen) {
                    el.classList.add('open');
                    const btn = el.querySelector('.dropdown-trigger');
                    if (btn) btn.setAttribute('aria-expanded', 'true');
                }
            }

            function closeDropdowns() {
                document.querySelectorAll('.custom-dropdown').forEach(d => {
                    d.classList.remove('open');
                    const btn = d.querySelector('.dropdown-trigger');
                    if (btn) btn.setAttribute('aria-expanded', 'false');
                });
            }

            $('lang-trigger').onclick = (e) => { e.stopPropagation(); toggleDropdown('lang-dropdown'); };
            $('edition-trigger').onclick = (e) => { e.stopPropagation(); toggleDropdown('edition-dropdown'); };
            document.addEventListener('click', () => closeDropdowns());

            // ---------- edition pickers ----------
            function fillLanguages() {
                const seen = new Map();
                EDITIONS.forEach(e => { if (!seen.has(e.language)) seen.set(e.language, e.language_name); });
                langSel.innerHTML = '';
                const menu = $('lang-menu');
                menu.innerHTML = '';

                for (const [code, name] of seen) {
                    const o = document.createElement('option');
                    o.value = code; o.textContent = name;
                    langSel.appendChild(o);

                    const li = document.createElement('li');
                    li.className = 'dropdown-item';
                    li.dataset.value = code;
                    li.innerHTML = `<span>${name}</span><svg class="check-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>`;
                    li.onclick = (evt) => {
                        evt.stopPropagation();
                        closeDropdowns();
                        langSel.value = code;
                        $('lang-trigger-text').textContent = name;
                        const nextId = fillEditions(code);
                        if (nextId) setEdition(nextId);
                    };
                    menu.appendChild(li);
                }
            }

            function fillEditions(lang, select) {
                const list = EDITIONS.filter(e => e.language === lang);
                edSel.innerHTML = '';
                const menu = $('edition-menu');
                menu.innerHTML = '';

                const chosen = (select && list.some(e => e.id === select)) ? select : (list[0] ? list[0].id : null);

                list.forEach(e => {
                    const o = document.createElement('option');
                    o.value = e.id;
                    const text = e.year ? `${e.abbrev} · ${e.year} ${e.era}` : e.abbrev;
                    o.textContent = text;
                    edSel.appendChild(o);

                    const li = document.createElement('li');
                    li.className = 'dropdown-item';
                    if (e.id === chosen) li.classList.add('selected');
                    li.dataset.value = e.id;
                    const yearLabel = e.year ? `${e.year} ${e.era}` : '';
                    const canonLabel = e.canon ? ` · ${e.canon}` : '';
                    li.innerHTML = `
                        <div style="display:flex;flex-direction:column;gap:1px;min-width:0;flex:1;">
                            <span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;">${e.abbrev}</span>
                            ${yearLabel ? `<span class="item-sub">${yearLabel}${canonLabel}</span>` : ''}
                        </div>
                        <svg class="check-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>`;
                    li.onclick = (evt) => {
                        evt.stopPropagation();
                        closeDropdowns();
                        setEdition(e.id);
                    };
                    menu.appendChild(li);
                });

                if (chosen) {
                    edSel.value = chosen;
                    const curEd = list.find(e => e.id === chosen);
                    if (curEd) {
                        $('edition-trigger-text').textContent = curEd.abbrev || curEd.title;
                    }
                }
                return chosen;
            }

            langSel.onchange = () => {
                const nextId = fillEditions(langSel.value);
                if (nextId) setEdition(nextId);
            };
            edSel.onchange = () => setEdition(edSel.value);

            /** Switch edition, holding the reader's place where possible. */
            async function setEdition(id) {
                const keepBook = bookId, keepCh = chapterNo;
                meta = await getJSON(ver(`${DATA}/${id}/meta.json`, id));
                booksById = {};
                meta.books.forEach(b => { booksById[b.id] = b; });

                document.documentElement.lang = meta.language;
                textEl.style.fontFamily = isEthiopic() ? 'var(--font-ethi)' : 'var(--font-latn)';
                applyLabels();
                $('title-main').textContent = meta.title;
                $('title-sub').textContent =
                    [meta.title_en, meta.publisher].filter(Boolean).join(' · ');
                const s = meta.stats;
                edMetaEl.textContent =
                    `${s.books} books · ${s.chapters.toLocaleString()} chapters · ${s.verses.toLocaleString()} verses`;

                const ed = EDITIONS.find(e => e.id === id);
                if (ed) {
                    langSel.value = ed.language;
                    $('lang-trigger-text').textContent = ed.language_name || ed.language;
                    fillEditions(ed.language, id);
                    $('edition-trigger-text').textContent = ed.abbrev || ed.title;
                }

                // Update selected classes in custom menus
                document.querySelectorAll('#lang-menu .dropdown-item').forEach(item => {
                    item.classList.toggle('selected', item.dataset.value === (ed ? ed.language : langSel.value));
                });
                document.querySelectorAll('#edition-menu .dropdown-item').forEach(item => {
                    item.classList.toggle('selected', item.dataset.value === id);
                });

                // hold the place if this edition has the same book
                let target = (keepBook && booksById[keepBook]) ? keepBook : null;
                if (target) {
                    testament = groupOf(target);
                } else if (!meta.books.some(b => groupOf(b.id) === testament)) {
                    testament = testament === 'old' ? 'new' : 'old';
                }
                renderTabs();
                renderBooks();
                if (!target) {
                    const first = sortedBooks().find(b => groupOf(b.id) === testament);
                    target = first && first.id;
                }
                if (target) await openBook(target, target === keepBook ? keepCh : 1);
                else showMessage('ይህ ዕትም መጻሕፍት የሉትም።');
            }

            // ---------- book / chapter lists ----------
            const sortedBooks = () =>
                meta.books.slice().sort((a, b) => (a.position || a.order) - (b.position || b.order));

            function renderTabs() {
                document.querySelectorAll('.tt-tab').forEach(t => {
                    const has = meta.books.some(b => groupOf(b.id) === t.dataset.t);
                    t.classList.toggle('active', t.dataset.t === testament);
                    t.disabled = !has;
                    t.style.opacity = has ? '' : '.35';
                });
            }

            function renderBooks() {
                booksEl.innerHTML = '';
                const list = sortedBooks().filter(b => groupOf(b.id) === testament);
                if (!list.length) {
                    booksEl.innerHTML =
                        `<li class="empty-note" style="cursor:default">${t().none}</li>`;
                    return;
                }
                list.forEach(b => {
                    const li = document.createElement('li');
                    li.textContent = b.name;
                    li.title = `${b.chapters} ምዕራፍ · ${b.verses} ቁጥር`;
                    li.dataset.id = b.id;
                    if (b.id === bookId) li.classList.add('active-item');
                    li.onclick = () => {
                        openBook(b.id, 1);
                        if (window.innerWidth <= 900) closeDrawer();
                    };
                    booksEl.appendChild(li);
                });
            }

            function renderChapters() {
                chaptersEl.innerHTML = '';
                if (!book) return;
                book.chapters.forEach(ch => {
                    const li = document.createElement('li');
                    li.textContent = num(ch.n);
                    li.dataset.n = ch.n;
                    if (ch.n === chapterNo) li.classList.add('active-item');
                    li.onclick = () => {
                        openChapter(ch.n);
                        if (window.innerWidth <= 900) closeDrawer();
                    };
                    chaptersEl.appendChild(li);
                });
            }

            document.querySelectorAll('.tt-tab').forEach(tab => {
                tab.onclick = () => {
                    testament = tab.dataset.t;
                    renderTabs();
                    renderBooks();
                };
            });

            // ---------- loading ----------
            function showMessage(html) {
                textEl.innerHTML = `<p class="msg">${html}</p>`;
                pagerEl.style.display = 'none';
            }

            async function openBook(id, chapter) {
                const entry = booksById[id];
                if (!entry) return;
                bookId = id;
                const key = `${meta.id}/${id}`;
                if (!cache.has(key)) {
                    showMessage(t().loading);
                    cache.set(key, await getJSON(
                        ver(`${DATA}/${meta.id}/${entry.file}`, meta.id)));
                }
                book = cache.get(key);
                testament = groupOf(id);
                renderTabs();
                renderBooks();
                const nums = book.chapters.map(c => c.n);
                const want = chapter === 'last' ? nums[nums.length - 1] : chapter;
                openChapter(nums.includes(want) ? want : nums[0]);
            }

            function openChapter(n, targetVerse) {
                chapterNo = n;
                renderChapters();
                renderChapter();
                saveState();
                updateUrlHash(targetVerse);
                const active = chaptersEl.querySelector('.active-item');
                if (active) active.scrollIntoView({ block: 'nearest' });
                if (targetVerse != null) {
                    setTimeout(() => {
                        highlightVerse(targetVerse);
                        const vEl = document.querySelector(`.verse[data-v="${targetVerse}"]`);
                        if (vEl) vEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }, 80);
                } else {
                    document.querySelector('main').scrollTop = 0;
                }
            }

            // ---------- rendering ----------
            function renderChapter() {
                const ch = book.chapters.find(c => c.n === chapterNo);
                const entry = booksById[bookId];
                if (!ch) return showMessage('ምዕራፉ አልተገኘም።');

                const L = t();
                titleEl.textContent = entry.name;
                const alt = ch.alt ? ` (${ch.alt})` : '';
                subEl.textContent =
                    `${L.chapter} ${num(ch.n)}${alt} · ${ch.verses.length} ${L.verses} · ${meta.abbrev}`;

                // headings are positional: `before` is the verse they precede
                const before = new Map();
                const trailing = [];
                (ch.headings || []).forEach(h => {
                    if (h.before == null) { trailing.push(h); return; }
                    if (!before.has(h.before)) before.set(h.before, []);
                    before.get(h.before).push(h);
                });

                const frag = document.createDocumentFragment();
                const addHeading = h => {
                    const el = document.createElement('div');
                    el.className = 'heading ' + (h.kind || 'section');
                    el.textContent = h.text;
                    frag.appendChild(el);
                };

                if (!ch.verses.length) {
                    (ch.headings || []).forEach(addHeading);
                }

                ch.verses.forEach(v => {
                    (before.get(v.n) || []).forEach(addHeading);

                    const p = document.createElement('p');
                    p.className = 'verse';
                    p.dataset.v = String(v.n);

                    const sup = document.createElement('span');
                    sup.className = 'vnum' + (geezNumerals && v.alt ? ' geez' : '');
                    sup.textContent = (geezNumerals && v.alt) ? v.alt : v.n;
                    sup.title = 'ጠቅ ያድርጉ ለመቅዳት / Click to copy citation';
                    sup.onclick = (e) => {
                        e.stopPropagation();
                        copyVerse(v);
                    };

                    if (v.lines && v.lines.length > 1) {
                        // the number goes *inside* the first line so every line
                        // keeps its own indent class
                        v.lines.forEach((ln, i) => {
                            const span = document.createElement('span');
                            span.className = 'vline ' + (ln.style || '').replace(/[^a-z0-9]/gi, '');
                            if (i === 0) span.appendChild(sup);
                            span.append(ln.t);
                            p.appendChild(span);
                        });
                    } else {
                        p.appendChild(sup);
                        p.append(v.t || '');
                    }

                    if (showAux) {
                        (v.notes || []).forEach(nt => p.appendChild(
                            aux(L.note, [nt.origin, nt.text].filter(Boolean).join(' — '))));
                        (v.refs || []).forEach(rf => p.appendChild(
                            aux(L.ref, [rf.origin, rf.target].filter(Boolean).join(' → '))));
                    }
                    frag.appendChild(p);
                });

                trailing.forEach(addHeading);

                textEl.innerHTML = '';
                textEl.appendChild(frag);
                renderPager();
            }

            function aux(label, text) {
                const el = document.createElement('span');
                el.className = 'aux';
                const b = document.createElement('b');
                b.textContent = label + ': ';
                el.appendChild(b);
                el.append(text);
                return el;
            }

            function renderPager() {
                const nums = book.chapters.map(c => c.n);
                const i = nums.indexOf(chapterNo);
                const books = sortedBooks();
                const bi = books.findIndex(b => b.id === bookId);
                const prev = $('prev-ch'), next = $('next-ch');

                prev.disabled = i <= 0 && bi <= 0;
                next.disabled = i >= nums.length - 1 && bi >= books.length - 1;
                pagerEl.style.display = 'flex';

                prev.onclick = () => i > 0
                    ? openChapter(nums[i - 1])
                    : openBook(books[bi - 1].id, 'last');
                next.onclick = () => i < nums.length - 1
                    ? openChapter(nums[i + 1])
                    : openBook(books[bi + 1].id, 1);
            }

            // Keyboard navigation
            document.addEventListener('keydown', (e) => {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA') return;
                if (e.key === 'ArrowLeft') {
                    const prev = $('prev-ch');
                    if (prev && !prev.disabled && prev.offsetParent !== null) prev.click();
                } else if (e.key === 'ArrowRight') {
                    const next = $('next-ch');
                    if (next && !next.disabled && next.offsetParent !== null) next.click();
                } else if (e.key === 'Escape') {
                    closeDrawer();
                }
            });

            // ---------- boot ----------
            (async function init() {
                applyTheme(localStorage.getItem('theme') || 'dark');
                applyFont(parseInt(localStorage.getItem('fontSize'), 10) || 21);
                geezNumerals = localStorage.getItem('geezNumerals') !== '0';
                showAux = localStorage.getItem('showAux') === '1';
                $('numerals-toggle').textContent = geezNumerals ? '፩' : '1';
                $('numerals-toggle').classList.toggle('on', geezNumerals);
                $('notes-toggle').classList.toggle('on', showAux);

                try {
                    // revisions.json is the freshness signal, so it is fetched
                    // revalidated rather than from cache. Missing or broken is
                    // not fatal -- the reader just loses cache-busting.
                    const revs = await getJSON(`${DATA}/revisions.json`,
                        { cache: 'no-cache' }).catch(() => null);
                    if (revs && revs.editions) REVISIONS = revs.editions;

                    const [edFile, canon] = await Promise.all([
                        getJSON(`${DATA}/editions.json`),
                        getJSON(`${DATA}/canon.json`)
                    ]);
                    EDITIONS = edFile.editions;
                    CANON = canon;
                    CANON.forEach(c => { canonById[c.id] = c; });

                    fillLanguages();

                    const parsed = parseHash();
                    let saved = null;
                    try { saved = JSON.parse(localStorage.getItem('bibleState')); } catch (_) { }

                    let start = EDITIONS[0].id;
                    if (parsed && parsed.edition && EDITIONS.some(e => e.id === parsed.edition)) {
                        start = parsed.edition;
                    } else if (saved && EDITIONS.some(e => e.id === saved.edition)) {
                        start = saved.edition;
                    }

                    if (parsed && parsed.bookId) {
                        bookId = parsed.bookId;
                        chapterNo = parsed.chapter || 1;
                        testament = groupOf(bookId);
                    } else if (saved) {
                        bookId = saved.bookId || null;
                        chapterNo = saved.chapter || 1;
                        testament = saved.testament || 'old';
                    }

                    const startEd = EDITIONS.find(e => e.id === start);
                    langSel.value = startEd.language;
                    fillEditions(startEd.language, start);
                    await setEdition(start);

                    if (parsed && parsed.verse != null) {
                        setTimeout(() => {
                            highlightVerse(parsed.verse);
                            const vEl = document.querySelector(`.verse[data-v="${parsed.verse}"]`);
                            if (vEl) vEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        }, 150);
                    }

                    window.addEventListener('hashchange', async () => {
                        const p = parseHash();
                        if (!p || !p.bookId) return;
                        if (p.edition && p.edition !== meta.id && EDITIONS.some(e => e.id === p.edition)) {
                            await setEdition(p.edition);
                        }
                        if (p.bookId !== bookId || p.chapter !== chapterNo) {
                            await openBook(p.bookId, p.chapter);
                        }
                        if (p.verse != null) {
                            highlightVerse(p.verse);
                        }
                    });
                } catch (err) {
                    console.error(err);
                    showMessage(
                        `<strong>ውሂቡ አልተጫነም።</strong><br>` +
                        `<code style="font-size:.85em">${err.message}</code><br><br>` +
                        `<span style="font-size:.85em">፩. <code>data/</code> መኖሩን ያረጋግጡ ` +
                        `(<code>python tools/build_bible.py outputs/source --out data</code>).<br>` +
                        `፪. ገጹን በ<code>file://</code> ሳይሆን በአገልጋይ ይክፈቱ ` +
                        `(<code>python -m http.server</code>).</span>`);
                }
            })();
        });
    </script>
</body>
